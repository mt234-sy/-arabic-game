<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>اسم حيوان نبات جماد بلاد</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}main{max-width:820px;margin:auto;padding:18px}.hero{text-align:center;padding:15px 0}.hero h1{font-size:25px;margin:0 0 7px}.muted{color:#667085;font-size:13px;line-height:1.7}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 28px #1118270a}input,button{font:inherit;font-size:16px;border-radius:14px;padding:14px}input{width:100%;border:1px solid #d0d5dd;outline:none}button{border:0;background:#4338ca;color:#fff;font-weight:800;min-height:50px;cursor:pointer}.alt{background:#eef2ff;color:#3730a3}.hidden{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.code{text-align:center;font-size:36px;font-weight:900;letter-spacing:6px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.letter{width:82px;height:82px;border-radius:24px;background:#111827;color:#fff;display:grid;place-items:center;font-size:43px;font-weight:900;flex:none}.fields{display:grid;gap:10px;margin-top:15px}.field{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center}.field label{font-weight:800}.wide{width:100%;margin-top:14px}.score{font-size:13px;color:#667085}.score b{display:block;font-size:25px;color:#172033}.players{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{background:#f2f4f7;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700}.board{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}.board th,.board td{padding:9px 6px;border-bottom:1px solid #e5e7eb;text-align:center}.rank{font-weight:900}.reviewWrap{overflow:auto}.answers{min-width:650px}.judge{padding:5px 7px;min-height:0;font-size:11px;background:#eef2ff;color:#3730a3;margin-top:4px}.status{margin-top:10px;text-align:center;font-weight:700}.timerWarn{font-size:34px!important}.invite{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.disconnected{opacity:.55}.history{margin-top:14px}.medal{font-size:20px}.finalTitle{text-align:center;font-size:24px}.history summary{cursor:pointer;font-weight:800;padding:10px 0}.countdown{position:fixed;inset:0;background:#111827e8;color:#fff;display:grid;place-items:center;z-index:9999;font-size:110px;font-weight:900}.countdown.go{font-size:64px}
</style></head><body><main><div class="hero"><h1>اسم • حيوان • نبات • جماد • بلاد</h1><div class="muted">من لاعبين إلى 6 لاعبين — كل لاعب من جواله</div></div>
<section id="home" class="card"><input id="name" maxlength="16" placeholder="اسمك"><div class="row" style="margin-top:10px"><button onclick="host()">إنشاء غرفة</button><button class="alt" onclick="joinBox.classList.toggle('hidden')">دخول غرفة</button></div><div id="joinBox" class="hidden" style="margin-top:10px"><input id="roomIn" maxlength="6" placeholder="رمز الغرفة"><button class="wide" onclick="join()">دخول</button></div><div id="msg" class="muted"></div></section>
<section id="lobby" class="card hidden"><div class="muted">رمز الغرفة</div><div id="roomCode" class="code"></div><div id="players" class="players"></div><div class="invite"><button class="alt" onclick="copyRoom()">نسخ رمز الغرفة</button><button class="alt" onclick="shareInvite()">مشاركة الدعوة</button></div><div id="lobbyMsg" class="muted status">بانتظار لاعب آخر…</div><button id="start" class="wide hidden" onclick="newRound()">ابدأ الجولة</button></section>
<section id="game" class="card hidden"><div class="top"><div><div class="score">الجولة <b id="round">1</b></div><div class="score">الوقت <b id="timer">30</b></div></div><div id="letter" class="letter"></div></div><div id="miniBoard"></div><div id="fields" class="fields"></div><button id="done" class="wide" onclick="submit()">خلصت</button><div id="wait" class="muted status"></div></section>
<section id="review" class="card hidden"><h3 id="reviewTitle">نتيجة الجولة</h3><div id="scoreBoard"></div><div class="reviewWrap"><table class="board answers"><thead id="reviewHead"></thead><tbody id="reviewRows"></tbody></table></div><div id="hostTools" class="hidden"><p class="muted">صاحب الغرفة يراجع الإجابات، ثم يعتمد النتيجة.</p><button class="wide" onclick="finalize()">اعتماد النتيجة</button></div><div id="guestWait" class="muted status hidden">بانتظار صاحب الغرفة لاعتماد النتيجة…</div><button id="next" class="wide hidden" onclick="newRound()">الجولة التالية</button><button id="restart" class="wide hidden" onclick="restartGame()">لعبة جديدة (10 جولات)</button><details id="historyBox" class="history hidden"><summary>تفاصيل الجولات</summary><div id="historyTable"></div></details></section>
<div id="countdown" class="countdown hidden">3</div><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
const cats=["اسم","حيوان","نبات","جماد","بلاد"],letters=["أ","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن","هـ","و","ي"],MAX=6,TOTAL_ROUNDS=10;
let peer,isHost=false,me="",myId="",room="",L="",rnd=0,endsAt=0,timerInt=null,countdownInt=null,roundClosed=false;
let conns={},hostConn=null,players={},answers={},valid={},roundPoints={},manualPoints={},usedLetters=[],history=[],reconnectTimer=null;
const $=id=>document.getElementById(id),joinBox=$("joinBox");
const playerKey=sessionStorage.playerKey||(sessionStorage.playerKey=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)));
function page(id){["home","lobby","game","review"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")}
function norm(s){return(s||"").trim().replace(/[إأآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ")}
function begins(s){return !!(s||"").trim()&&norm(s).startsWith(norm(L))}
function roomCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function broadcast(m,except=""){Object.entries(conns).forEach(([id,c])=>{if(id!==except&&c.open)c.send(m)})}
function sendHost(m){if(hostConn?.open)hostConn.send(m)}
function roster(){return Object.values(players).sort((a,b)=>a.join-b.join)}
function inviteUrl(){let u=new URL(location.href);u.searchParams.set("room",room);return u.toString()}
async function copyRoom(){try{await navigator.clipboard.writeText(room);$("lobbyMsg").textContent="تم نسخ رمز الغرفة: "+room}catch(e){prompt("انسخ رمز الغرفة",room)}}
async function shareInvite(){let url=inviteUrl(),data={title:"اسم حيوان نبات جماد بلاد",text:`ادخل الغرفة ${room}`,url};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(url);$("lobbyMsg").textContent="تم نسخ رابط الدعوة."}}catch(e){}}
function host(){me=$("name").value.trim();if(!me)return $("msg").textContent="اكتب اسمك.";isHost=true;room=roomCode();$("msg").textContent="جاري إنشاء الغرفة…";peer=new Peer("arabic-categories-"+room);peer.on("open",id=>{myId=id;players[id]={id,key:playerKey,name:me,total:0,join:0,connected:true};$("roomCode").textContent=room;renderLobby();page("lobby")});peer.on("connection",acceptConn);peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});peer.on("error",()=>$("msg").textContent="تعذر إنشاء الغرفة. جرّب مرة أخرى.")}
function acceptConn(c){conns[c.peer]=c;c.on("data",m=>hostData(c,m));c.on("close",()=>markDisconnected(c.peer))}
function markDisconnected(id){delete conns[id];if(players[id]){players[id].connected=false;syncRoster();setTimeout(()=>{if(players[id]&&!players[id].connected&&!roundClosed&&rnd>0){answers[id]??={};checkAnswers()}},3000)}}
function connectGuest(){if(hostConn?.open)return;hostConn=peer.connect("arabic-categories-"+room,{reliable:true});hostConn.on("open",()=>{clearTimeout(reconnectTimer);hostConn.send({type:"hello",name:me,key:playerKey});$("roomCode").textContent=room});hostConn.on("data",guestData);hostConn.on("close",()=>{if(room){$("lobbyMsg").textContent="انقطع الاتصال — جاري إعادة المحاولة…";reconnectTimer=setTimeout(connectGuest,1500)}})}
function join(){me=$("name").value.trim();room=$("roomIn").value.trim().toUpperCase();if(!me||room.length<4)return $("msg").textContent="اكتب الاسم ورمز الغرفة.";isHost=false;peer=new Peer();peer.on("open",id=>{myId=id;connectGuest();page("lobby")});peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});peer.on("error",()=>$("msg").textContent="تعذر الاتصال بالغرفة.")}
function hostData(c,m){if(m.type==="hello"){let old=roster().find(p=>p.key===m.key);if(old){delete players[old.id];delete conns[old.id];old.id=c.peer;old.connected=true;players[c.peer]=old}else{if(roster().length>=MAX){c.send({type:"full"});setTimeout(()=>c.close(),500);return}players[c.peer]={id:c.peer,key:m.key,name:(m.name||"لاعب").slice(0,16),total:0,join:Date.now(),connected:true}}syncRoster();if(rnd>0&&!roundClosed)c.send({type:"round",rnd,L,startsAt:Math.max(Date.now()+800,endsAt-30000)})}else if(m.type==="finish"&&!roundClosed){answers[c.peer]=m.a;closeRound(c.peer)}else if(m.type==="stopped"){answers[c.peer]=m.a;checkAnswers()}}
function guestData(m){if(m.type==="full"){alert("الغرفة مكتملة (6 لاعبين).");location.reload()}else if(m.type==="roster"){players=m.players;renderLobby();renderMiniBoard()}else if(m.type==="round"){rnd=m.rnd;L=m.L;startCountdown(m.startsAt)}else if(m.type==="stop"){if(!roundClosed){roundClosed=true;clearInterval(timerInt);let a=captureAnswers();sendHost({type:"stopped",a});$("wait").textContent=m.reason==="time"?"انتهى الوقت — توقفت الجولة.":`${m.name} ضغط «خلصت» — توقفت الجولة.`}}else if(m.type==="review"){answers=m.answers;valid=m.valid;roundPoints=calcPoints();renderReview(false);page("review");$("guestWait").classList.remove("hidden")}else if(m.type==="final"){players=m.players;answers=m.answers;valid=m.valid;roundPoints=m.roundPoints;history=m.history||history;renderReview(false);$("guestWait").classList.add("hidden");renderScoreBoard();renderMiniBoard();if(m.gameOver)showGameOver(false);else $("guestWait").textContent="بانتظار صاحب الغرفة لبدء الجولة التالية…"}}
function syncRoster(){broadcast({type:"roster",players});renderLobby();renderMiniBoard()}
function renderLobby(){let list=roster();$("players").innerHTML=list.map(p=>`<span class="chip ${p.connected===false?'disconnected':''}">${safe(p.name)} ${p.connected===false?'— منقطع':'✓'}</span>`).join("");$("lobbyMsg").textContent=`${list.filter(p=>p.connected!==false).length} لاعبين متصلين`+(list.length<2?" — بانتظار لاعب آخر…":"");if(isHost)$("start").classList.toggle("hidden",list.filter(p=>p.connected!==false).length<2)}
function chooseLetter(){let pool=letters.filter(x=>!usedLetters.includes(x));if(!pool.length){usedLetters=[];pool=[...letters]}let x=pool[Math.floor(Math.random()*pool.length)];usedLetters.push(x);return x}
function newRound(){if(!isHost||roster().filter(p=>p.connected!==false).length<2||rnd>=TOTAL_ROUNDS)return;rnd++;L=chooseLetter();answers={};valid={};roundPoints={};manualPoints={};roundClosed=false;let startsAt=Date.now()+3800;endsAt=startsAt+30000;broadcast({type:"round",rnd,L,startsAt});startCountdown(startsAt)}
function startCountdown(startsAt){clearInterval(timerInt);clearInterval(countdownInt);roundClosed=false;page("game");$("round").textContent=rnd+" / "+TOTAL_ROUNDS;$("letter").textContent="؟";$("timer").textContent="30";$("fields").innerHTML=cats.map(c=>`<div class="field"><label>${c}</label><input data-c="${c}" disabled autocomplete="off" autocorrect="off"></div>`).join("");$("done").disabled=true;$("wait").textContent="استعد…";let box=$("countdown");box.classList.remove("hidden","go");const tick=()=>{let ms=startsAt-Date.now();if(ms<=0){clearInterval(countdownInt);box.textContent="ابدأ!";box.classList.add("go");setTimeout(()=>{box.classList.add("hidden");box.classList.remove("go");startRoundUI()},350);return}box.textContent=Math.max(1,Math.ceil(ms/1000))};tick();countdownInt=setInterval(tick,80)}
function startRoundUI(){roundClosed=false;endsAt=Date.now()+30000;$("round").textContent=rnd+" / "+TOTAL_ROUNDS;$("letter").textContent=L;$("timer").textContent="30";$("timer").classList.remove("timerWarn");$("fields").innerHTML=cats.map(c=>`<div class="field"><label>${c}</label><input data-c="${c}" autocomplete="off" autocorrect="off"></div>`).join("");$("done").disabled=false;$("wait").textContent="";$("next").classList.add("hidden");$("restart").classList.add("hidden");$("historyBox").classList.add("hidden");$("reviewTitle").textContent="نتيجة الجولة";$("hostTools").classList.add("hidden");$("guestWait").classList.add("hidden");renderMiniBoard();page("game");startTimer()}
function startTimer(){clearInterval(timerInt);const tick=()=>{let left=Math.max(0,Math.ceil((endsAt-Date.now())/1000));$("timer").textContent=left;$("timer").classList.toggle("timerWarn",left<=5&&left>0);if(left<=0){clearInterval(timerInt);if(isHost&&!roundClosed)closeRound("TIME")}};tick();timerInt=setInterval(tick,200)}
function captureAnswers(){let a={};document.querySelectorAll("[data-c]").forEach(i=>{a[i.dataset.c]=i.value.trim();i.disabled=true});$("done").disabled=true;return a}
function submit(){if(roundClosed)return;clearInterval(timerInt);let a=captureAnswers();if(isHost){answers[myId]=a;closeRound(myId)}else{roundClosed=true;sendHost({type:"finish",a});$("wait").textContent="تم — جاري إيقاف الجولة عند الجميع…"}}
function closeRound(who){if(roundClosed)return;roundClosed=true;clearInterval(timerInt);if(!answers[myId])answers[myId]=captureAnswers();let time=who==="TIME",name=time?"":(players[who]?.name||me);broadcast({type:"stop",reason:time?"time":"done",name});$("wait").textContent=time?"انتهى الوقت — توقفت الجولة.":`${name} ضغط «خلصت» — توقفت الجولة.`;checkAnswers()}
function checkAnswers(){if(!isHost)return;let ids=roster().filter(p=>p.connected!==false).map(p=>p.id);if(ids.every(id=>answers[id]))prepare()}
function prepare(){valid={};roster().forEach(p=>{answers[p.id]??={};valid[p.id]={};cats.forEach(c=>valid[p.id][c]=begins(answers[p.id]?.[c]))});roundPoints=calcPoints();broadcast({type:"review",answers,valid});renderReview(true);page("review");$("hostTools").classList.remove("hidden")}
function catPoints(id,c){if(manualPoints[id]?.[c]!==undefined)return manualPoints[id][c];if(!valid[id]?.[c])return 0;let a=norm(answers[id]?.[c]);let duplicate=roster().some(p=>p.id!==id&&valid[p.id]?.[c]&&norm(answers[p.id]?.[c])===a);return duplicate?5:10}
function calcPoints(){let out={};roster().forEach(p=>{out[p.id]=0;cats.forEach(c=>out[p.id]+=catPoints(p.id,c))});return out}
function renderReview(hostMode){let list=roster();$("reviewHead").innerHTML=`<tr><th>الفئة</th>${list.map(p=>`<th>${safe(p.name)}</th>`).join("")}</tr>`;$("reviewRows").innerHTML=cats.map(c=>`<tr><td><b>${c}</b></td>${list.map(p=>{let a=answers[p.id]?.[c]||"",pts=catPoints(p.id,c);return `<td>${safe(a)||"—"}<br><b>${pts} نقاط</b>${hostMode?`<br><div class="row" style="gap:4px;margin-top:4px"><button class="judge" onclick="setPts('${p.id}','${c}',10)">10</button><button class="judge" onclick="setPts('${p.id}','${c}',5)">5</button><button class="judge" onclick="setPts('${p.id}','${c}',0)">0</button></div>`:""}</td>`}).join("")}</tr>`).join("");renderScoreBoard()}
function setPts(id,c,n){manualPoints[id]??={};manualPoints[id][c]=n;valid[id]??={};valid[id][c]=n>0;roundPoints=calcPoints();renderReview(true);$("hostTools").classList.remove("hidden")}
function finalize(){roundPoints=calcPoints();roster().forEach(p=>players[p.id].total=(players[p.id].total||0)+(roundPoints[p.id]||0));history.push({round:rnd,letter:L,points:{...roundPoints},names:Object.fromEntries(roster().map(p=>[p.id,p.name]))});let gameOver=rnd>=TOTAL_ROUNDS;broadcast({type:"final",players,answers,valid,roundPoints,history,gameOver});renderReview(false);renderScoreBoard();$("hostTools").classList.add("hidden");if(gameOver)showGameOver(true);else $("next").classList.remove("hidden");syncRoster()}
function showGameOver(hostMode){$("reviewTitle").innerHTML='<div class="finalTitle">النتيجة النهائية بعد 10 جولات</div>';$("next").classList.add("hidden");$("guestWait").classList.add("hidden");if(hostMode)$("restart").classList.remove("hidden");renderScoreBoard(true);renderHistory();$("historyBox").classList.remove("hidden")}
function restartGame(){if(!isHost)return;rnd=0;usedLetters=[];history=[];roster().forEach(p=>players[p.id].total=0);answers={};valid={};roundPoints={};manualPoints={};$("restart").classList.add("hidden");$("historyBox").classList.add("hidden");$("reviewTitle").textContent="نتيجة الجولة";syncRoster();newRound()}
function sortedScores(){return roster().slice().sort((a,b)=>(b.total||0)-(a.total||0)||a.join-b.join)}
function ranks(list){let last=null,rank=0;return list.map((p,i)=>{if(last===null||p.total!==last)rank=i+1;last=p.total;return rank})}
function renderScoreBoard(final=false){let list=sortedScores(),rs=ranks(list);$("scoreBoard").innerHTML=`<table class="board"><thead><tr><th>الترتيب</th><th>اللاعب</th><th>الجولة</th><th>المجموع</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td class="rank">${final?(rs[i]===1?'🥇 ':rs[i]===2?'🥈 ':rs[i]===3?'🥉 ':'')+rs[i]:rs[i]}</td><td>${safe(p.name)}</td><td>${roundPoints[p.id]??0}</td><td><b>${p.total||0}</b></td></tr>`).join("")}</tbody></table>`}
function renderHistory(){let ids=roster().map(p=>p.id);$("historyTable").innerHTML=`<table class="board"><thead><tr><th>الجولة</th><th>الحرف</th>${ids.map(id=>`<th>${safe(players[id]?.name||history.find(h=>h.names[id])?.names[id]||'لاعب')}</th>`).join('')}</tr></thead><tbody>${history.map(h=>`<tr><td>${h.round}</td><td><b>${h.letter}</b></td>${ids.map(id=>`<td>${h.points[id]??0}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function renderMiniBoard(){let el=$("miniBoard");if(!el)return;let list=sortedScores();el.innerHTML=list.length?`<table class="board"><thead><tr><th>اللاعب</th><th>المجموع</th></tr></thead><tbody>${list.map(p=>`<tr><td>${safe(p.name)}</td><td><b>${p.total||0}</b></td></tr>`).join("")}</tbody></table>`:""}
(function initInvite(){let r=new URLSearchParams(location.search).get("room");if(r){$("roomIn").value=r.toUpperCase();joinBox.classList.remove("hidden")}})();
</script></main></body></html>
